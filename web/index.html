<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AROHA — Integrated Polar Expedition Logistics & Asset Management System (NCPOR)">
  <meta name="theme-color" content="#09151C" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F6F1" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AROHA Polar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AROHA — Polar Expedition Logistics Command</title>
  <script>
    // shared_preferences_web stores values under the `flutter.` prefix.
    // Apply an explicit saved choice before Flutter paints to avoid a flash.
    (() => {
      try {
        const saved = window.localStorage.getItem('flutter.aroha_theme_is_dark');
        if (saved === 'true' || saved === 'false') {
          const shellColor = saved === 'true' ? '#09151c' : '#f4f6f1';
          document.documentElement.style.setProperty(
            '--aroha-shell-background',
            shellColor,
          );
        }
      } catch (_) {
        // Storage can be unavailable in private browsing; OS fallback remains.
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --aroha-shell-background: #09151c;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background-color: var(--aroha-shell-background);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --aroha-shell-background: #f4f6f1;
      }
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
