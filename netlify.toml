# Netlify configuration for the AROHA Flutter web build.
#
# This site is DEPLOYED PREBUILT, not built by Netlify.
#
# Why: neither Netlify nor Vercel has first-class Flutter support, and this
# project targets Flutter 3.41.7 / Dart 3.11.5 — recent enough that a hosted
# image may pin an older SDK and fail to resolve `sdk: ^3.11.5` in pubspec.yaml.
# Letting a remote image resolve the toolchain makes the judge link hostage to
# whatever SDK happens to be installed. Building the Dart locally (or in the
# GitHub Actions workflow) and publishing the result removes that variable
# entirely: the bytes that get tested are the bytes that get served.
#
# To publish:
#   flutter build web --release --base-href / \
#     --dart-define=NCPOR_PROXY=https://qznvgjsenqtdxoidnuht.supabase.co/functions/v1/npdc-proxy?url=
#   netlify deploy --dir=build/web --prod
#
# The trailing "/?url=" on NCPOR_PROXY is required — the app appends the
# percent-encoded portal URL to that prefix. See
# supabase/functions/npdc-proxy for the proxy itself.
#
# --base-href is "/" because Netlify serves from the domain root. Using
# "/Aroha/" (the GitHub Pages value) yields a blank page, since the app then
# requests main.dart.js one directory too deep.

[build]
  publish = "build/web"
  # No remote build step, by design. See the note above.
  command = ""

# Flutter's own service worker handles asset caching and version handshake.
# Do not let Netlify pre-compress or fingerprint anything the app addresses by
# literal name, or those requests 404.
[build.processing]
  skip_processing = false

# The service worker must be served from the site root, or it cannot control
# the whole scope and stale builds get pinned in judges' browsers.
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# The bootstrap and entry documents decide WHICH build a visitor gets, so they
# must never be cached. This is what stops a judge loading a stale bundle
# after a redeploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Compiled Dart and wasm are content-hashed by the Flutter build, so they are
# safe to cache hard.
[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The call room uses getUserMedia, and the NPDC telemetry reader needs outbound
# HTTPS. Deny everything else so a compromised dependency cannot exfiltrate by
# accident. No third-party origins are needed at runtime: fonts are bundled
# locally and telemetry goes through our own Edge Function.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://nitin-basker10.github.io https://qznvgjsenqtdxoidnuht.supabase.co; media-src 'self' blob: mediastream:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
